<header><h1>Customer Churn & Retention Intelligence<small>Subscription analytics · synthetic dataset of 1,200 customers · last 12 months</small></h1></header>
<nav id="nav"></nav><main id="view"></main>
<script>
const $=s=>document.querySelector(s);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(5),gs=()=>Math.sqrt(-2*Math.log(1-R()))*Math.cos(6.283185*R()),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),sg=z=>1/(1+Math.exp(-z)),pk=w=>{let t=R()*w.reduce((a,b)=>a+b),i=0;for(;i<w.length-1&&(t-=w[i])>0;i++);return i};
const fm=v=>v>=1e7?'₹'+(v/1e7).toFixed(2)+' Cr':v>=1e5?'₹'+(v/1e5).toFixed(1)+' L':'₹'+Math.round(v).toLocaleString('en-IN'),pc=x=>(x*100).toFixed(1)+'%';
const PN=['Basic','Pro','Business'],PR=[499,999,2499],CA=['Disengagement','Poor adoption','Service friction','Billing issues','Low satisfaction','Price & value','Mixed signals'];
const FS=[['logins','Monthly logins',0],['dsl','Days since last login',0],['trend','Usage trend',0],['adopt','Features adopted (of 8)',1],['onb','Onboarding completed',1],['ten','Tenure (months)',1],['tix','Support tickets (90d)',2],['unres','Unresolved tickets',2],['pf','Payment failures (90d)',3],['nps','NPS (0–10)',4],['pinc','Recent price increase',5],['disc','Active discount %',5],['ann','Annual contract',5]];
const tf=(k,v)=>k=='dsl'||k=='ten'?Math.log(v+1):v;
const E=[];for(let i=0;i<1200;i++){const e=gs(),pl=pk([.5,.35,.15]),disc=R()<.25?[10,20,30][Math.floor(R()*3)]:0,logins=Math.max(0,Math.round(14+5*e+gs()*3)),dsl=Math.max(0,Math.round(Math.exp(1.6-.6*e+gs()*.6))),trend=+cl(-.05+.25*e+gs()*.2,-.9,.8).toFixed(2),adopt=cl(Math.round(4+1.6*e+gs()),0,8),
tix=Math.max(0,Math.round(gs()*1.2+1.2+(R()<.2?3:0))),unres=R()<.25?Math.min(tix,Math.round(R()*2+1)):0,pf=R()<.12?1+Math.floor(R()*3):0,nps=cl(Math.round(7+1.8*e+gs()*1.5-.8*unres),0,10),ten=Math.min(60,1+Math.floor(-Math.log(1-R())*14)),onb=R()<cl(.75+.1*e,.3,.95)?1:0,pinc=R()<.3?1:0,ann=R()<.3?1:0;
const l=-2.1-.5*(logins-14)/5+.55*(Math.log(dsl+1)-1.9)/.7-.7*trend/.3-.35*(adopt-4)/1.7+.4*(tix-1.5)/1.3+.6*unres+.7*(pf>0)+.45*pinc-.45*(nps-7)/2-.3*(disc>0)+.6*(ten<4)-.5*onb-.9*ann;
E.push({id:'C'+(2001+i),pl,disc,logins,dsl,trend,adopt,tix,unres,pf,nps,ten,onb,pinc,ann,mrr:Math.round(PR[pl]*(1-disc/100)),churn:R()<sg(l),cm:pk(Array.from({length:12},(_,k)=>1+.08*(k+1)))})}
const n=E.length,K=FS.length,M=[],S=[];FS.forEach((f,k)=>{const v=E.map(c=>tf(f[0],c[f[0]]));M[k]=v.reduce((a,b)=>a+b)/n;S[k]=Math.sqrt(v.reduce((a,b)=>a+(b-M[k])**2,0)/n)||1});
const zz=(c,k)=>(tf(FS[k][0],c[FS[k][0]])-M[k])/S[k];let W=Array(K).fill(0),B=0;const TR=E.filter((_,i)=>i%10<7),X=TR.map(c=>FS.map((_,k)=>zz(c,k)));
for(let it=0;it<500;it++){const g=Array(K).fill(0);let gb=0;TR.forEach((c,i)=>{let s=B;for(let k=0;k<K;k++)s+=W[k]*X[i][k];const er=sg(s)-(c.churn?1:0);gb+=er;for(let k=0;k<K;k++)g[k]+=er*X[i][k]});for(let k=0;k<K;k++)W[k]-=.5*(g[k]/TR.length+.002*W[k]);B-=.5*gb/TR.length}
const risk=(c,o)=>{let s=B;FS.forEach((f,k)=>{const v=o&&o[f[0]]!==undefined?o[f[0]]:c[f[0]];s+=W[k]*(tf(f[0],v)-M[k])/S[k]});return sg(s)};E.forEach(c=>c.p=risk(c));
const HO=E.filter((_,i)=>i%10>=7),AUC=(()=>{let a=0,c=0;HO.filter(x=>x.churn).forEach(x=>HO.filter(y=>!y.churn).forEach(y=>{c++;a+=x.p>y.p?1:x.p==y.p?.5:0}));return a/c})();
const RET=E.filter(c=>!c.churn),HV=FS.map((f,k)=>RET.reduce((a,c)=>a+tf(f[0],c[f[0]]),0)/RET.length),ACT=RET,LOST=E.filter(c=>c.churn);
const TV={logins:RET.reduce((a,c)=>a+c.logins,0)/RET.length,dsl:RET.reduce((a,c)=>a+c.dsl,0)/RET.length,trend:RET.reduce((a,c)=>a+c.trend,0)/RET.length,adopt:RET.reduce((a,c)=>a+c.adopt,0)/RET.length,onb:1,unres:0,pf:0,nps:RET.reduce((a,c)=>a+c.nps,0)/RET.length,ann:1};
function diag(c){const ct=FS.map((f,k)=>({k,f,v:W[k]*(zz(c,k)-(HV[k]-M[k])/S[k])})),cs=CA.map(()=>0);ct.forEach(x=>{if(x.v>0)cs[x.f[2]]=Math.max(cs[x.f[2]],x.v)});c.cs=cs;c.drv=ct.filter(x=>x.v>.08).sort((a,b)=>b.v-a.v)}
ACT.forEach(diag);const GSC=CA.map((_,g)=>ACT.reduce((a,c)=>a+c.cs[g],0)/ACT.length||1);ACT.forEach(c=>{const r=c.cs.map((v,g)=>v/GSC[g]),mx=Math.max(...r.slice(0,6));c.cause=Math.max(...c.cs)<.2?'Mixed signals':CA[r.indexOf(mx)]});const tier=p=>p>=.5?['Critical','var(--bad)']:p>=.3?['High','#e8741a']:p>=.15?['Medium','var(--warn)']:['Low','var(--good)'];
const PB={'Disengagement':{a:'Re-engagement journey with personal check-in',o:'Free 1:1 training or a pause option',ch:'Email + in-app',cost:150,sr:.22},'Poor adoption':{a:'Guided onboarding and feature activation',o:'Onboarding call and template pack',ch:'In-app + CSM call',cost:400,sr:.3},'Service friction':{a:'Escalate tickets and run service recovery',o:'Dedicated specialist and goodwill credit',ch:'Phone + email',cost:600,sr:.35},'Billing issues':{a:'Payment recovery: smart retries and card-update prompts',o:'Grace period and flexible billing date',ch:'Email + SMS',cost:80,sr:.55},'Low satisfaction':{a:'Listen and recover: survey and executive outreach',o:'Roadmap preview and account review',ch:'Phone or CSM',cost:500,sr:.28},'Price & value':{a:'Prove value and offer flexible pricing',o:'Annual plan 20% off or a lighter plan',ch:'Email + account manager',cost:300,sr:.25},'Mixed signals':{a:'Light-touch health check',o:'Check-in email with a help link',ch:'Email',cost:100,sr:.15}};
const MSG={'Disengagement':c=>`We noticed you have not logged in for ${c.dsl} days. Your ${PN[c.pl]} plan has features that could save you time. Book a free 20-minute session, or pause your plan for a month if now is a busy time.`,'Poor adoption':c=>`You are using ${c.adopt} of 8 features on ${PN[c.pl]}. Customers who activate 5 or more stay far longer. Join a free guided setup call this week and we will configure it with you.`,'Service friction':c=>`We are sorry your support request has stayed open. A senior specialist now owns your case, and we have added a goodwill credit of ${fm(c.mrr*.5)} to your account.`,'Billing issues':c=>`Your last payment did not go through. Update your card in one tap; your access stays active for 10 more days so nothing is interrupted.`,'Low satisfaction':c=>`Your recent rating of ${c.nps}/10 matters to us. Our product lead would like 15 minutes to hear what is missing, and to show you what we are building next.`,'Price & value':c=>`${PN[c.pl]} recently changed price. Switch to annual billing and save 20%, or move to a lighter plan that matches how you actually use the product.`,'Mixed signals':c=>`Just checking in: is ${PN[c.pl]} working for you? Reply to this message and we will help with anything you need.`};
const val=c=>c.mrr*12*.8,P=[['No login in 14+ days',c=>c.dsl>=14],['Usage down >30%',c=>c.trend<-.3],['Payment failure (90d)',c=>c.pf>0],['Unresolved support ticket',c=>c.unres>0],['Low adoption (≤2 features)',c=>c.adopt<=2],['Onboarding not completed',c=>!c.onb],['Recent price increase',c=>c.pinc],['Early tenure (<3 months)',c=>c.ten<3],['NPS 6 or below',c=>c.nps<=6],['Monthly contract',c=>!c.ann]];
const rate=l=>l.length?l.filter(c=>c.churn).length/l.length:0;
function km(l){const o=[1];let s=1;for(let t=1;t<=24;t++){const nr=l.filter(c=>c.ten>=t).length,ev=l.filter(c=>c.ten==t&&c.churn).length;if(nr)s*=1-ev/nr;o.push(s)}return o}
function bars(rows,fmt,max){max=max||Math.max(...rows.map(r=>r[1]));return rows.map(r=>`<div class=br><span>${r[0]}</span><div class=bt><i style="width:${Math.max(0,r[1])/max*100}%;background:${r[2]||'var(--acc)'}"></i></div><b>${fmt(r[1])}</b></div>`).join('')}
const CC=['#d6336c','#2f8fe0','#e8a317','#7a4df0','#16a6a6','#2ea66b','#8b97aa'];
const T=[['ov','Overview'],['pt','Churn patterns'],['sg','At-risk segments & causes'],['c3','Customer 360'],['rl','Retention lab'],['ag','AI agent'],['br','Problem brief']];
let tab=(location.hash||'#ov').slice(1);if(!T.some(t=>t[0]==tab))tab='ov';
function go(t){tab=t;location.hash=t;nav();V[t]()}function nav(){$('#nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
const kp=(b,s,c)=>`<div class="card kpi"><span>${s}</span><b class="${c||''}">${b}</b></div>`,seg=()=>CA.map((x,i)=>{const l=ACT.filter(c=>c.cause==x&&c.p>=.15);return{n:x,i,l,mrr:l.reduce((a,c)=>a+c.mrr*c.p,0),cnt:l.length,pr:l.length?l.reduce((a,c)=>a+c.p,0)/l.length:0}}).sort((a,b)=>b.mrr-a.mrr);
const V={
ov(){const lm=LOST.reduce((a,c)=>a+c.mrr,0),ar=ACT.reduce((a,c)=>a+c.mrr*c.p,0),cm=Array(12).fill(0);LOST.forEach(c=>cm[c.cm]++);const nw=cm.map((_,i)=>Math.round(21+Math.sin(i*2)*1.5)),mx=Math.max(...cm,...nw)+3,X=i=>35+i*34,Y=v=>140-v/mx*125,fl=cm.findIndex((v,i)=>v>nw[i]),ks=[0,1,2].map(p=>km(E.filter(c=>c.pl==p)));
$('#view').innerHTML=`<div class="g k">${kp(n,'Customers (start of period)')}${kp(LOST.length,'Churned, last 12 months','bad')}${kp(pc(LOST.length/n),'Churn rate','bad')}${kp(fm(lm)+'/mo','MRR lost')}${kp(fm(ar)+'/mo','MRR at risk (expected)')}${kp(fm(LOST.length*4500),'Acquisition cost spent replacing churn')}</div>
<div class="g c2" style="margin-top:14px"><div class=card><h3>Churn is catching up with acquisition</h3><p class=sub>Monthly new customers (marketing, flat) vs churned customers</p><svg viewBox="0 0 440 165" style="width:100%"><polyline fill=none stroke="var(--mut)" stroke-width=2.5 points="${nw.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/><polyline fill=none stroke="var(--acc)" stroke-width=2.5 points="${cm.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${cm.map((v,i)=>`<text x=${X(i)} y=158 font-size=9 text-anchor=middle fill="var(--mut)">${'JFMAMJJASOND'[i]}</text>`).join('')}</svg><p class=sub><span style="color:var(--mut)">━</span> New customers &nbsp;<span style="color:var(--acc)">━</span> Churned</p><p>${fl>=0?`From month <b>${fl+1}</b> more customers leave than join, so marketing spend is now mostly replacing losses.`:'Churn is approaching new-customer volume.'}</p></div>
<div class=card><h3>Retention curves by plan</h3><p class=sub>Kaplan-Meier survival: share of customers still subscribed by month</p><svg viewBox="0 0 440 180" style="width:100%">${[.4,.6,.8,1].map(v=>`<line x1=35 x2=430 y1=${160-(v-.3)/.7*140} y2=${160-(v-.3)/.7*140} stroke="var(--line)"/><text x=4 y=${163-(v-.3)/.7*140} font-size=9 fill="var(--mut)">${v*100}%</text>`).join('')}${ks.map((k,p)=>`<polyline fill=none stroke="${CC[p]}" stroke-width=2.5 points="${k.map((v,t)=>(35+t*16.4)+','+(160-(Math.max(v,.3)-.3)/.7*140)).join(' ')}"/>`).join('')}${[0,6,12,18,24].map(t=>`<text x=${35+t*16.4} y=175 font-size=9 text-anchor=middle fill="var(--mut)">${t}m</text>`).join('')}</svg><p class=sub>${PN.map((p,i)=>`<span style="color:${CC[i]}">━</span> ${p} (12m: ${pc(ks[i][12])})`).join(' &nbsp; ')}</p></div>
<div class=card><h3>Churn by plan</h3>${bars(PN.map((p,i)=>[p,rate(E.filter(c=>c.pl==i)),CC[i]]),pc)}<h3 style="margin-top:12px">Churn by tenure</h3>${bars([['0–3 months',0,3],['4–12 months',4,12],['13–24 months',13,24],['25+ months',25,99]].map(b=>[b[0],rate(E.filter(c=>c.ten>=b[1]&&c.ten<=b[2]))]),pc)}</div>
<div class=card><h3>Model and risk tiers</h3><p class=sub>Logistic regression, holdout AUC <b>${AUC.toFixed(2)}</b> (trained on 70%, tested on 30%)</p>${bars(['Critical','High','Medium','Low'].map(t=>{const l=ACT.filter(c=>tier(c.p)[0]==t);return[t+' ('+l.length+')',l.reduce((a,c)=>a+c.mrr,0),tier(l[0]?l[0].p:.5)[1]]}),v=>fm(v))}<p class=sub>MRR sitting in each risk tier among active customers.</p></div></div>`},
pt(){const mx=Math.max(...W.map(Math.abs)),o=FS.map((_,k)=>k).sort((a,b)=>Math.abs(W[b])-Math.abs(W[a])),pr=P.map(p=>{const a=E.filter(p[1]),b=E.filter(c=>!p[1](c));return{n:p[0],cnt:a.length,r:rate(a),rr:rate(a)/rate(b)}}).sort((a,b)=>b.rr-a.rr),pairs=[];
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const l=E.filter(c=>P[i][1](c)&&P[j][1](c));if(l.length>=25)pairs.push({n:P[i][0]+' + '+P[j][0],cnt:l.length,r:rate(l)})}pairs.sort((a,b)=>b.r-a.r);
$('#view').innerHTML=`<div class="g c2"><div class=card><h3>Behavioral patterns linked to churn</h3><p class=sub>Churn rate when the pattern is present, and relative risk vs customers without it</p><div class=wrap><table><tr><th>Pattern</th><th class=n>Customers</th><th class=n>Churn</th><th class=n>Relative risk</th></tr>${pr.map(x=>`<tr><td>${x.n}</td><td class=n>${x.cnt}</td><td class=n>${pc(x.r)}</td><td class=n><b class="${x.rr>2?'bad':''}">${x.rr.toFixed(1)}x</b></td></tr>`).join('')}</table></div></div>
<div class=card><h3>Most dangerous combinations</h3><p class=sub>Pairs of patterns (at least 25 customers) with highest churn</p>${bars(pairs.slice(0,6).map(x=>[x.n,x.r,'var(--bad)']),pc,1).replace(/150px/g,'230px')}<h3 style="margin-top:14px">Model driver strength</h3><p class=sub>Standardized effect on churn odds (red raises, green lowers risk)</p>${o.slice(0,8).map(k=>`<div class=br><span>${FS[k][1]}</span><div class=bt><i style="width:${Math.abs(W[k])/mx*100}%;background:${W[k]>0?'var(--bad)':'var(--good)'}"></i></div><b>OR ${Math.exp(W[k]).toFixed(2)}</b></div>`).join('')}</div></div>`},
sg(){const s=seg(),tm=s.reduce((a,x)=>a+x.mrr,0),tot=ACT.filter(c=>c.p>=.15).length;
$('#view').innerHTML=`<div class="g c2"><div class=card><h3>At-risk customers by root cause</h3><p class=sub>Customers with risk ≥15%, grouped by their strongest churn driver. ${tot} customers, ${fm(tm)}/mo expected MRR loss.</p>${bars(s.map(x=>[x.n,x.mrr,CC[x.i]]),fm)}<div class=wrap style="margin-top:10px"><table><tr><th>Cause</th><th class=n>Customers</th><th class=n>Avg risk</th><th class=n>MRR at risk</th></tr>${s.map(x=>`<tr><td><span class=pill style="background:${CC[x.i]}">${x.n}</span></td><td class=n>${x.cnt}</td><td class=n>${pc(x.pr)}</td><td class=n>${fm(x.mrr)}</td></tr>`).join('')}</table></div></div>
<div class=card><h3>Cause × plan matrix</h3><p class=sub>At-risk customers per cause and plan</p><div class=wrap><table><tr><th>Cause</th>${PN.map(p=>`<th class=n>${p}</th>`).join('')}</tr>${s.map(x=>`<tr><td>${x.n}</td>${PN.map((_,p)=>{const v=x.l.filter(c=>c.pl==p).length;return`<td class=n style="background:rgba(214,51,108,${Math.min(.5,v/40)})">${v}</td>`}).join('')}</tr>`).join('')}</table></div><h3 style="margin-top:14px">Recommended play per segment</h3>${s.slice(0,4).map(x=>`<p style="margin:6px 0"><span class=pill style="background:${CC[x.i]}">${x.n}</span> ${PB[x.n].a}. <span class=sub>${PB[x.n].o} via ${PB[x.n].ch}</span></p>`).join('')}</div></div>`},
c3(){const top=[...ACT].sort((a,b)=>b.p*b.mrr-a.p*a.mrr).slice(0,40);$('#view').innerHTML=`<div class=card><div class=row><select id=cs>${top.map(c=>`<option>${c.id}</option>`).join('')}</select><input type=text id=ci placeholder="or search an active customer ID, e.g. C2045"><button class="btn p" id=cg>Load</button></div></div><div id=co style="margin-top:14px"></div>`;
const u=id=>{const c=ACT.find(x=>x.id==id.toUpperCase());if(!c){$('#co').innerHTML='<div class=card>Customer not found among active customers.</div>';return}$('#co').innerHTML=c360(c)};$('#cs').onchange=e=>u(e.target.value);$('#cg').onclick=()=>u($('#ci').value||$('#cs').value);u(top[0].id)},
rl(){const rows=CA.map(x=>x);$('#view').innerHTML=`<div class="g c2"><div class=card><h3>Retention lab</h3><p class=sub>Pick who to target and tune expected save rates. Value of a save = 12 months of MRR at 80% margin.</p><label class=sub>Target group</label><br><select id=tg><option value=.3>Critical + High risk (≥30%)</option><option value=.15>Add Medium risk (≥15%)</option><option value=0>All active customers</option></select>
${rows.map((x,i)=>`<div style="margin-top:10px"><label class=row style="font-size:12.5px"><input type=checkbox id=ck${i} checked> <span style="flex:1">${x}</span><b id=sv${i}>${Math.round(PB[x].sr*100)}%</b></label><input type=range id=sr${i} min=5 max=70 value=${Math.round(PB[x].sr*100)}></div>`).join('')}</div><div class=card id=ro></div></div>`;
window.RLU=()=>{const th=+$('#tg').value;let tc=0,ts=0,tv=0,tt=0;const t=rows.map((x,i)=>{const on=$('#ck'+i).checked,sr=+$('#sr'+i).value/100;$('#sv'+i).textContent=Math.round(sr*100)+'%';const l=on?ACT.filter(c=>c.cause==x&&c.p>=th):[],cost=l.length*PB[x].cost,sv=l.reduce((a,c)=>a+c.p*sr,0),v=l.reduce((a,c)=>a+c.p*sr*val(c),0);tc+=cost;ts+=sv;tv+=v;tt+=l.length;return[x,l.length,sv,cost,v]});
$('#ro').innerHTML=`<h3>Projected impact</h3><div class="g k"><div class=kpi><span>Customers treated</span><b>${tt}</b></div><div class=kpi><span>Expected saves</span><b class=good>${ts.toFixed(1)}</b></div><div class=kpi><span>Value retained</span><b>${fm(tv)}</b></div><div class=kpi><span>Programme cost</span><b>${fm(tc)}</b></div><div class=kpi><span>Net ROI</span><b class="${tv>=tc?'good':'bad'}">${tc?((tv-tc)/tc*100).toFixed(0)+'%':'—'}</b></div></div><div class=wrap style="margin-top:12px"><table><tr><th>Cause</th><th class=n>Treated</th><th class=n>Saves</th><th class=n>Cost</th><th class=n>Value</th></tr>${t.map(r=>`<tr><td>${r[0]}</td><td class=n>${r[1]}</td><td class=n>${r[2].toFixed(1)}</td><td class=n>${fm(r[3])}</td><td class=n>${fm(r[4])}</td></tr>`).join('')}</table></div><p class=sub style="margin-top:10px">Save rates and per-customer costs are assumptions (₹80 to ₹600). Test with holdout groups before rollout.</p>`};document.querySelectorAll('#view input,#view select').forEach(e=>e.oninput=RLU);RLU()},
ag(){$('#view').innerHTML=`<div class="g c2"><div class=card><h3>Retention intelligence agent</h3><p class=sub>Ask about patterns, causes, at-risk customers, strategy and ROI.</p><div class=chat id=ch></div><div class=qs>${['Why are customers churning?','Who is most at risk?','What are the main causes?','What does retention look like by tenure?','Recommend a retention plan','Tell me about billing issues','Explain customer C2045','What if we target high risk customers with 30% save rate?'].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div><div class=row><input type=text id=qi placeholder="e.g. how is the Business plan doing?"><button class="btn p" onclick="ask()">Ask</button></div></div>
<div class=card><h3>Top 5 priority customers</h3><p class=sub>Ranked by expected MRR loss</p><table><tr><th>ID</th><th>Plan</th><th>Risk</th><th>Cause</th></tr>${[...ACT].sort((a,b)=>b.p*b.mrr-a.p*a.mrr).slice(0,5).map(c=>`<tr><td>${c.id}</td><td>${PN[c.pl]}</td><td><span class=pill style="background:${tier(c.p)[1]}">${pc(c.p)}</span></td><td>${c.cause}</td></tr>`).join('')}</table><p class=sub style="margin-top:12px">Open Customer 360 for each person’s drivers and personalized message.</p></div></div>`;
$('#qi').onkeydown=e=>{if(e.key=='Enter')ask()};say('a','Hello, I am your retention analyst. '+LOST.length+' of '+n+' customers churned this year, costing '+fm(LOST.reduce((a,c)=>a+c.mrr,0))+' a month. What would you like to explore?')},
br(){$('#view').innerHTML=`<div class="g c2"><div class=card><h3>The problem</h3><p>A subscription business keeps spending on marketing, but customers leave faster than before. Marketing now mostly replaces lost customers instead of growing the base, and each churned customer also takes future revenue with them.</p><h3>The ask</h3><ul><li><b>Identify</b> behavioral patterns that precede churn.</li><li><b>Segment</b> at-risk customers by risk and by cause.</li><li><b>Diagnose</b> the probable cause for each customer.</li><li><b>Personalize</b> retention actions and messages, with expected ROI.</li></ul></div>
<div class=card><h3>Solution architecture</h3><ul><li><b>Data layer:</b> billing, product usage, support and survey data joined by customer ID.</li><li><b>Pattern mining:</b> relative-risk tables and pattern combinations.</li><li><b>Prediction:</b> logistic regression with holdout validation; customer-level risk and driver contributions.</li><li><b>Cause engine:</b> driver contributions grouped into 6 root causes.</li><li><b>Strategy engine:</b> playbook per cause, personalized messages, counterfactual “fix” effects, ROI simulator.</li><li><b>Agent:</b> natural-language access to all of it.</li></ul></div>
<div class=card><h3>Assumed data</h3><div class=wrap><table><tr><th>Source</th><th>Fields</th></tr><tr><td>Billing</td><td>plan, MRR, discount, payment failures, annual or monthly, price increase</td></tr><tr><td>Product</td><td>logins, days since login, usage trend, features adopted, onboarding</td></tr><tr><td>Support/CX</td><td>tickets, unresolved tickets, NPS</td></tr></table></div></div>
<div class=card><h3>Caveats</h3><ul><li>Data is synthetic with built-in relationships, so results demonstrate the method only.</li><li>Drivers are associations, not proven causes. Test retention actions with control groups.</li><li>Save rates, costs, CAC (₹4,500) and margin (80%) are assumptions.</li><li>Use outreach responsibly: honour consent, avoid manipulative discounting.</li></ul></div></div>`}};
function c360(c){const t=tier(c.p),pb=PB[c.cause],mx=Math.max(...c.drv.map(d=>d.v),.1),cf=c.drv.filter(d=>TV[d.f[0]]!==undefined).slice(0,3).map(d=>({n:d.f[1],p:risk(c,{[d.f[0]]:TV[d.f[0]]})}));
return`<div class="g c2"><div class=card><h3>${c.id} · ${PN[c.pl]} · ${fm(c.mrr)}/mo</h3><p class=sub>Tenure ${c.ten} months · ${c.ann?'annual':'monthly'} contract</p><div class="g k"><div class=kpi><span>Churn risk</span><b style="color:${t[1]}">${pc(c.p)}</b></div><div class=kpi><span>Tier</span><b style="color:${t[1]}">${t[0]}</b></div><div class=kpi><span>Value at stake</span><b>${fm(val(c))}</b></div></div>
<p style="margin-top:12px"><b>Diagnosed cause:</b> <span class=pill style="background:${CC[CA.indexOf(c.cause)]}">${c.cause}</span></p><p class=sub>Top risk drivers</p>${c.drv.slice(0,5).map(d=>`<div class=br><span>${d.f[1]}</span><div class=bt><i style="width:${d.v/mx*100}%;background:var(--bad)"></i></div><b>${c[d.f[0]]}</b></div>`).join('')||'<p class=sub>No strong single driver.</p>'}
<p class=sub style="margin-top:10px">Signals: ${c.logins} logins/mo, ${c.dsl} days since login, usage ${c.trend>0?'+':''}${Math.round(c.trend*100)}%, ${c.adopt}/8 features, NPS ${c.nps}, ${c.tix} tickets (${c.unres} open), ${c.pf} payment failures.</p></div>
<div class=card><h3>Personalized retention strategy</h3><p><b>Action:</b> ${pb.a}</p><p><b>Offer:</b> ${pb.o}</p><span class=tag>Channel: ${pb.ch}</span><span class=tag>Cost: ₹${pb.cost}</span><span class=tag>Expected save rate: ${Math.round(pb.sr*100)}%</span>
<p class=sub style="margin-top:12px">Draft message</p><div class=quote>${MSG[c.cause](c)}</div><p class=sub>If fixed, estimated risk would become:</p>${cf.map(x=>`<div class=br><span>${x.n}</span><div class=bt><i style="width:${x.p/Math.max(c.p,.01)*100}%;background:var(--good)"></i></div><b>${pc(x.p)}</b></div>`).join('')||'<p class=sub>No directly fixable driver.</p>'}<p class=sub>Expected value of treating: <b>${fm(c.p*pb.sr*val(c))}</b> for ₹${pb.cost} cost.</p></div></div>`}
function say(w,h){const c=$('#ch');c.insertAdjacentHTML('beforeend',`<div class="m ${w}">${h}</div>`);c.scrollTop=c.scrollHeight}
function ask(q){q=q||$('#qi').value.trim();if(!q)return;$('#qi').value='';say('u',q);say('a','<i>Analysing…</i>');setTimeout(()=>{$('#ch').lastChild.remove();say('a',agent(q))},350)}
const KC={disengag:0,engage:0,adopt:1,onboard:1,service:2,support:2,billing:3,payment:3,satisf:4,nps:4,price:5,value:5,mixed:6};
function agent(q){const t=q.toLowerCase(),idm=t.match(/c?(\d{4})/),cu=idm&&ACT.find(c=>c.id=='C'+idm[1]),pl=['basic','pro','business'].findIndex(p=>new RegExp('\\b'+p).test(t)),num=(t.match(/(\d+)\s*%/)||[])[1];
if(idm&&cu)return`<b>${cu.id}</b> (${PN[cu.pl]}, ${fm(cu.mrr)}/mo): risk <b>${pc(cu.p)}</b> (${tier(cu.p)[0]}), cause <b>${cu.cause}</b>. Play: ${PB[cu.cause].a}. Message:<div class=quote>${MSG[cu.cause](cu)}</div>`;
if(/what if|simulate|target/.test(t)){const th=/critical/.test(t)?.5:/medium/.test(t)?.15:.3,sr=(num?+num:30)/100,l=ACT.filter(c=>c.p>=th),v=l.reduce((a,c)=>a+c.p*sr*val(c),0),co=l.reduce((a,c)=>a+PB[c.cause].cost,0);return`Targeting ${l.length} customers with risk ≥${Math.round(th*100)}% at a ${Math.round(sr*100)}% save rate: expected saves <b>${l.reduce((a,c)=>a+c.p*sr,0).toFixed(1)}</b>, value retained <b>${fm(v)}</b>, cost <b>${fm(co)}</b>, ROI <b class="${v>=co?'good':'bad'}">${((v-co)/co*100).toFixed(0)}%</b>.`}
const ck=Object.keys(KC).find(k=>t.includes(k));if(ck!==undefined&&!/plan/.test(t)){const x=seg().find(s=>s.n==CA[KC[ck]]),p=PB[x.n];return`<b>${x.n}</b>: ${x.cnt} at-risk customers, avg risk ${pc(x.pr)}, ${fm(x.mrr)}/mo expected loss. Play: ${p.a}. Offer: ${p.o} via ${p.ch}. Assumed save rate ${Math.round(p.sr*100)}%, ₹${p.cost} per customer.`}
if(pl>=0){const l=E.filter(c=>c.pl==pl),k=km(l);return`<b>${PN[pl]}</b>: ${l.length} customers, churn ${pc(rate(l))}, 12-month retention ${pc(k[12])}, average MRR ${fm(l.reduce((a,c)=>a+c.mrr,0)/l.length)}.`}
if(/who|risk|priority|top/.test(t))return`Highest expected MRR loss:<ul>${[...ACT].sort((a,b)=>b.p*b.mrr-a.p*a.mrr).slice(0,5).map(c=>`<li><b>${c.id}</b> ${PN[c.pl]}, ${pc(c.p)} risk, ${c.cause}</li>`).join('')}</ul>`;
if(/cause|segment|root/.test(t)){const s=seg();return`At-risk MRR by cause: ${s.slice(0,5).map(x=>`<b>${x.n}</b> ${fm(x.mrr)} (${x.cnt})`).join(', ')}.`}
if(/tenure|cohort|curve|survival|retention look|early/.test(t)){const k=km(E);return`Overall retention: <b>${pc(k[3])}</b> at 3 months, <b>${pc(k[6])}</b> at 6, <b>${pc(k[12])}</b> at 12, <b>${pc(k[24])}</b> at 24. Customers in their first 3 months churn at ${pc(rate(E.filter(c=>c.ten<4)))} versus ${pc(rate(E.filter(c=>c.ten>12)))} after a year, so onboarding is critical.`}
if(/plan|recommend|strategy|retain|playbook|action/.test(t)){const s=seg().map(x=>{const v=x.l.reduce((a,c)=>a+c.p*PB[x.n].sr*val(c),0),co=x.l.length*PB[x.n].cost;return{...x,v,co,roi:co?(v-co)/co:0}}).sort((a,b)=>b.roi-a.roi);return`Ranked by ROI for at-risk customers:<ol>${s.slice(0,5).map(x=>`<li><b>${x.n}</b>: ${PB[x.n].a}. ROI ${(x.roi*100).toFixed(0)}%, value ${fm(x.v)}</li>`).join('')}</ol>`}
if(/why|driver|pattern|churning|reason/.test(t)){const o=P.map(p=>({n:p[0],rr:rate(E.filter(p[1]))/rate(E.filter(c=>!p[1](c)))})).sort((a,b)=>b.rr-a.rr).slice(0,4),w=FS.map((_,k)=>k).sort((a,b)=>Math.abs(W[b])-Math.abs(W[a])).slice(0,3);return`Strongest patterns: ${o.map(x=>`<b>${x.n}</b> (${x.rr.toFixed(1)}x risk)`).join(', ')}. Top model drivers: ${w.map(k=>FS[k][1]).join(', ')}. Open Churn patterns for combinations.`}
if(/mrr|revenue|cost|money|loss|lost/.test(t))return`Churned customers took <b>${fm(LOST.reduce((a,c)=>a+c.mrr,0))}/mo</b> of MRR. Expected further loss from current at-risk customers: <b>${fm(ACT.reduce((a,c)=>a+c.mrr*c.p,0))}/mo</b>. Replacing churned customers cost about ${fm(LOST.length*4500)} in acquisition spend.`;
return'Try: <b>why are customers churning</b>, <b>who is most at risk</b>, <b>main causes</b>, <b>retention by tenure</b>, <b>a retention plan</b>, a cause such as <b>billing</b>, a plan such as <b>Pro</b>, a customer like <b>C2045</b>, or a what-if like “target high risk customers with 30% save rate”.'}
